server:
  port: 8761

spring:
  application:
    name: discovery-server

# registry 本身不需要向自己註冊
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # 練習環境關掉自我保護，服務下線才會馬上從清單消失
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
